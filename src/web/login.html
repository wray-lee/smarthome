<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | home</title>
<script>
"use strict";
// One flat dictionary per language. A missing zh-CN or ja key falls back to
// the English value, and then to the key itself, so a gap is visible, not blank.
var I18N={
"en":{
/* i18n:en */
"login.title":"Sign in | home",
"login.heading":"Sign in",
"login.passwordLabel":"Password",
"login.submit":"Sign in",
"err.wrong_password":"Wrong password",
"err.rate_limited":"Too many failed attempts. Wait before trying again.",
/* /i18n */
},
"zh-CN":{
/* i18n:zh-CN */
"login.title":"登录 | home",
"login.heading":"登录",
"login.passwordLabel":"密码",
"login.submit":"登录",
"err.wrong_password":"密码错误，请重试。",
"err.rate_limited":"密码错误次数过多，请稍后再试。",
/* /i18n */
},
"ja":{
/* i18n:ja */
"login.title":"ログイン | home",
"login.heading":"ログイン",
"login.passwordLabel":"パスワード",
"login.submit":"ログイン",
"err.wrong_password":"パスワードが正しくありません。",
"err.rate_limited":"パスワードの失敗が多すぎます。しばらく待ってからもう一度お試しください。",
/* /i18n */
}
};
var SETTINGS_KEY="home_panel_settings";
function readSettings(){
  var d={lang:"auto",theme:"auto"};
  try{
    var raw=localStorage.getItem(SETTINGS_KEY);
    if(!raw)return d;
    var s=JSON.parse(raw);
    if(!s||typeof s!=="object")return d;
    if(["auto","en","zh-CN","ja"].indexOf(String(s.lang))!==-1)d.lang=s.lang;
    if(["auto","light","dark"].indexOf(String(s.theme))!==-1)d.theme=s.theme;
  }catch(e){}
  return d;
}
// A saved language wins; otherwise the first browser preference that is zh*,
// ja* or en* decides, and anything else lands on English.
function pickLang(setting,langs){
  if(setting&&setting!=="auto")return setting;
  langs=langs||[];
  for(var i=0;i<langs.length;i++){
    var l=String(langs[i]||"").toLowerCase();
    if(l.indexOf("zh")===0)return "zh-CN";
    if(l.indexOf("ja")===0)return "ja";
    if(l.indexOf("en")===0)return "en";
  }
  return "en";
}
var SETTINGS=readSettings();
var LANG=pickLang(SETTINGS.lang,navigator.languages||[navigator.language||"en"]);
document.documentElement.lang=LANG;
// Only an explicit choice is pinned; "auto" leaves color-scheme following the OS.
if(SETTINGS.theme==="light"||SETTINGS.theme==="dark")document.documentElement.setAttribute("data-theme",SETTINGS.theme);
function t(key){
  var d=I18N[LANG]||I18N.en;
  var v=d[key];
  if(v===undefined)v=I18N.en[key];
  return v===undefined?key:v;
}
</script>
<style>
:root{
/* The panel's tokens, by name and by value, so both pages read as one product.
light-dark() picks the pair from the used color-scheme, which data-theme pins. */
color-scheme:light dark;
--page:light-dark(#E4E3DE,#14181A);
--page-ink:light-dark(#232A2B,#EAE7DF);
--bay:light-dark(#F4F3EF,#1C2224);
--row:light-dark(#FBFAF7,#262E30);
--ink:light-dark(#232A2B,#EAE7DF);
--ink2:light-dark(#3F4849,#C6CFCF);
--muted:light-dark(#555E61,#A0A9AB);
--line:light-dark(#6F797B,#6F7A7D);
--rule:light-dark(#B4BAB8,#394345);
--rail:light-dark(#263032,#0B0F10);
--rail-ink:light-dark(#F3F2EC,#EAE7DF);
--rail-ink2:light-dark(#B9C2C2,#A7B0B2);
--err:light-dark(#93251C,#FFA096);
--accent:light-dark(#1D5A63,#6FBCC1);
--lamp:light-dark(#7FD3CE,#8FDCD6);
--focus:var(--accent);
--focus-rail:light-dark(#7FD3CE,#8FDCD6);
--btn:light-dark(#FBFAF7,#EAE7DF);
--btn-ink:light-dark(#232A2B,#14181A);
}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5;background:var(--page);color:var(--page-ink)}
header{padding:1rem;background:var(--rail);color:var(--rail-ink);border-block-end:1px solid var(--rail-ink2)}
h1{margin:0;font-size:1.25rem;line-height:1.25;font-weight:700}
main{max-inline-size:26rem;margin-inline:auto;padding:1.5rem 1.25rem}
/* The form is a panel bolted to the backplate: a real 1px frame, a petrol top
edge, no shadow. */
form{display:flex;flex-direction:column;gap:.375rem;background:var(--bay);border:1px solid var(--line);border-block-start:3px solid var(--accent);padding:1.25rem}
h2{margin:0 0 .25rem;font-size:1.125rem;line-height:1.3;color:var(--ink)}
label{font-weight:600;color:var(--ink)}
input[type="password"]{font:inherit;font-size:max(1rem,1em);min-height:48px;padding:.75rem;border:1px solid var(--line);border-radius:2px;color:var(--ink);background:var(--row);width:100%}
button[type="submit"]{font:inherit;font-size:1rem;min-height:48px;margin-top:.5rem;padding:.75rem 1.25rem;border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:var(--page);font-weight:700;cursor:pointer;width:100%}
button[type="submit"]:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header :focus-visible{outline-color:var(--focus-rail)}
/* An error is a real border plus the word; never colour alone. */
[role="alert"]{margin:.25rem 0 0;padding:.75rem 1rem;border:1px solid var(--line);border-inline-start:4px solid var(--err);background:var(--row);color:var(--err)}
@media (max-width:320px){main{padding:1rem .75rem}}
</style>
</head>
<body>
<header><h1>home</h1></header>
<main>
<form method="post" action="/login" aria-labelledby="signin-title">
<h2 id="signin-title" data-i18n="login.heading">Sign in</h2>
<div id="server-err"></div>
<label for="pw">Password</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required enterkeyhint="go">
<button type="submit" data-i18n="login.submit">Sign in</button>
</form>
</main>
<script>
(function(){
  var slot=document.getElementById("server-err");
  // The label keeps the served English literal, which a smoke test asserts;
  // its text is set here so the markup stays readable without scripts.
  function applyI18n(){
    var nodes=document.querySelectorAll("[data-i18n]");
    for(var i=0;i<nodes.length;i++)nodes[i].textContent=t(nodes[i].getAttribute("data-i18n"));
    document.querySelector("label[for='pw']").textContent=t("login.passwordLabel");
    document.title=t("login.title");
  }
  applyI18n();
  // The server renders a failed POST as an inline alert plus aria-invalid; the
  // data-code picks the translation, and an unknown code keeps the server text.
  // The query-string branch covers the redirect form of the same error.
  var m=/[?&]error=([^&#]*)/.exec(location.search);
  if(m&&!slot.querySelector("[role='alert']")){
    var p=document.createElement("p");
    p.setAttribute("role","alert");
    p.textContent=decodeURIComponent(m[1].replace(/\+/g," "));
    slot.appendChild(p);
  }
  var alert=slot.querySelector("[role='alert']");
  if(alert){
    // An unknown code keeps the English text the server put there.
    var code=alert.getAttribute("data-code");
    var key=code?"err."+code:"";
    if(key&&I18N.en[key])alert.textContent=t(key);
    document.getElementById("pw").setAttribute("aria-invalid","true");
  }
})();
</script>
</body>
</html>
