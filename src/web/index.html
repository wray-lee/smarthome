<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>home</title>
<style>
:root{
color-scheme:light dark;
/* Cool gray enclosure, graphite rail, one tungsten accent. */
--page:#DDE1E3;
--page-ink:#2A2F33;
--page-ink2:#4A5156;
--rail:#2A2F33;
--rail-ink:#E9ECEE;
--rail-ink2:#C3C9CD;
--bay:#F1F3F4;
--ink:#2A2F33;
--ink2:#3C4348;
--muted:#5A6166;
--line:#5A6166;
--rule:#A7AEB2;
--err:#B3261E;
--amber:#F2B705;
--switch:#2A2F33;
--switch-ink:#E9ECEE;
--focus:#2A2F33;
--focus-rail:#F2B705;
--btn:#F1F3F4;
--btn-ink:#1B1F22;
--slider:#2A2F33;
}
@media (prefers-color-scheme:dark){
:root{
--page:#1B1F22;
--page-ink:#E9ECEE;
--page-ink2:#C3C9CD;
--rail:#0E1113;
--bay:#262C30;
--ink:#E9ECEE;
--ink2:#C3C9CD;
--muted:#A8B0B5;
--line:#9AA3A9;
--rule:#3A4247;
--err:#FF9E94;
--switch:#121619;
--focus:#F2B705;
--focus-rail:#F2B705;
--btn:#E9ECEE;
--btn-ink:#121619;
--slider:#F2B705;
}
}
*{box-sizing:border-box}
body{margin:0;padding:0 0 3rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5;background:var(--page);color:var(--page-ink);overflow-wrap:break-word;text-align:start}
.wrap{max-inline-size:80rem;margin-inline:auto;padding-inline:1rem}
header{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:1rem;background:var(--rail);color:var(--rail-ink);border:2px solid var(--rail);border-block-end-width:3px}
/* Fluid but capped below 1.5x body: the live power reading is the only
enlarged text on the page (see .watts). */
h1{margin:0;margin-inline-end:auto;font-size:clamp(1.125rem,1rem + .4vw,1.375rem);line-height:1.25;font-weight:700;text-wrap:balance;color:var(--rail-ink)}
header .bar{display:flex;gap:.5rem;flex-wrap:wrap}
button{font:inherit;font-size:1rem;min-block-size:2.75rem;min-inline-size:2.75rem;padding:.5rem .875rem;border:1.5px solid var(--line);border-radius:0;background:var(--bay);color:var(--ink);font-weight:600;cursor:pointer}
button.primary{background:var(--ink);color:var(--bay);border-color:var(--ink)}
header button{background:transparent;color:var(--rail-ink);border-color:var(--rail-ink2)}
header button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
header :focus-visible{outline-color:var(--focus-rail)}
main{padding-block-start:.5rem}
.status{margin:.75rem 0 0;padding:.5rem .75rem;background:var(--bay);border:2px solid var(--line);border-block-end:0;color:var(--page-ink2);font-size:.9375rem}
.banner{background:var(--bay);color:var(--ink);border:2px solid var(--err);padding:.75rem 1rem;margin:.75rem 0;display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.banner[hidden]{display:none}
.banner .banner-text{flex:1 1 16rem;min-inline-size:0}
.banner code{display:block;overflow-wrap:anywhere;margin-block:.25rem;padding:.5rem .75rem;background:var(--page);color:var(--page-ink);border:1px solid var(--line)}
.enclosure{display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem;padding:.75rem;margin:0 0 1rem;background:var(--page);border:2px solid var(--line)}
@media (min-width:64rem){.enclosure{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bay{background:var(--bay);border:1px solid var(--line);min-inline-size:0}
.bay-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.5rem .75rem;border-block-end:2px solid var(--line)}
.bay-head h3{margin:0;font-size:1.0625rem;line-height:1.3;font-weight:700;text-wrap:balance}
.backend{font-size:.8125rem;font-weight:600;color:var(--ink2);border:1px solid var(--line);padding:.0625rem .375rem}
.breakers{list-style:none;margin:0;padding:0}
li.device{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id ctl" "read ctl";gap:.25rem .75rem;align-items:start;padding:.625rem .75rem;border-block-start:1px solid var(--rule);min-inline-size:0}
li.device:first-child{border-block-start:0}
.dev-id{grid-area:id;min-inline-size:0}
.name{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.dev-read{grid-area:read;min-inline-size:0}
.dev-ctl{grid-area:ctl;display:flex;flex-direction:column;align-items:center;gap:.25rem;align-self:center}
.ctl-slot{display:flex;flex-direction:column;align-items:center}
.state{margin:0;font-size:.875rem;color:var(--ink2)}
.sync-note{color:var(--ink2);font-weight:600}
.err-text{color:var(--err);font-weight:600;font-size:.875rem;margin:.25rem 0 0}
.power{display:flex;align-items:baseline;gap:.25rem;margin:.125rem 0}
.watts{display:inline-block;font-size:clamp(1.75rem,1.2rem + 1.8vw,2.5rem);line-height:1.3;font-weight:600;font-variant-numeric:tabular-nums}
.unit{font-size:.9375rem;font-weight:600;color:var(--ink2)}
.tele{margin-block-start:.375rem;min-inline-size:0}
.tele h3{margin:0 0 .125rem;font-size:.8125rem;font-weight:600;color:var(--ink2)}
.tele ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.125rem 1rem}
.tele li{display:flex;gap:.375rem;align-items:baseline;font-size:.875rem}
.tlabel{color:var(--muted)}
.tval{font-weight:600;font-variant-numeric:tabular-nums}
.note{margin:.125rem 0;font-size:.875rem;color:var(--ink2)}
.ctrls{display:grid;grid-template-columns:minmax(0,1fr);gap:.5rem;margin-block-start:.375rem;min-inline-size:0}
@media (min-width:64rem){.ctrls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:.125rem;min-inline-size:0}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.field-head label{font-weight:600;font-size:.875rem}
.val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;grid-column:1 / -1;min-inline-size:0}
.ctrl-row .field{flex:1 1 8rem;min-inline-size:0}
input[type="range"]{width:100%;min-block-size:2.75rem;margin:0;accent-color:var(--slider);cursor:pointer}
select,input[type="number"],input[type="text"],input[type="password"]{font:inherit;font-size:max(1rem,1em);min-block-size:2.75rem;padding:.5rem .625rem;border:1.5px solid var(--line);border-radius:0;background:var(--bay);color:var(--ink);width:100%}
/* break-word, not anywhere: a missing space in a trait name must not split
ordinary words at 200% zoom. */
.ro{margin:.125rem 0;font-size:.8125rem;color:var(--ink2);overflow-wrap:break-word}
/* Raw read-only readings collapse behind one native disclosure per row, so the
default row is name, state, one reading and the switch. */
details{margin-block-start:.25rem}
summary{display:inline-flex;align-items:center;gap:.375rem;min-block-size:2.75rem;font-size:.875rem;font-weight:600;color:var(--ink2);cursor:pointer;list-style-position:inside}
summary::before{content:"+";display:inline-block;inline-size:1rem;font-weight:700}
details[open] summary::before{content:"\2212"}
details[open] summary{margin-block-end:.125rem}
/* A safety cover around the switch: a hatched plate that carries the word
protected, with the switch inside it. The word, not colour, says so. */
.cover{position:relative;display:inline-flex;flex-direction:column;gap:.125rem;padding:.25rem;border:2px solid var(--line);border-radius:2px}
/* The hatch lies over the switch, at a strength that leaves the On/Off word
   readable, and never takes the pointer. */
.cover::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0 7px,var(--line) 7px 8px);opacity:.3}
.cover .guard{position:relative;z-index:2;padding:.0625rem .25rem;text-align:center;background:var(--bay);color:var(--ink);border:1px solid var(--line);font-size:.75rem;font-weight:600;line-height:1.3;overflow-wrap:break-word}
.device-empty{background:var(--bay);color:var(--ink2);border:2px dashed var(--line);padding:1rem;margin:0}
.err-box{background:var(--bay);color:var(--ink);border:2px solid var(--err);padding:.75rem 1rem;margin:0}
.err-box button{margin-block-start:.75rem}
.rocker{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.25rem;inline-size:3.5rem;min-block-size:4.5rem;padding:.5rem .25rem;background:var(--switch);color:var(--switch-ink);border:1.5px solid var(--line);border-radius:3px;cursor:pointer}
.rocker .led{flex:none;inline-size:.625rem;block-size:.625rem;border-radius:50%;border:1.5px solid var(--switch-ink);background:transparent}
.rocker[aria-checked="true"] .led{background:var(--amber);border-color:var(--amber)}
.rocker .paddle{flex:none;inline-size:1.75rem;block-size:.5rem;background:var(--switch-ink);border-radius:2px}
.rocker .pos{flex:none;font-size:.75rem;font-weight:600;line-height:1.5}
.rocker.offline{background:transparent;color:var(--ink);border:2px dashed var(--line);justify-content:center;cursor:not-allowed;font-size:.75rem}
.action{min-inline-size:3.5rem;min-block-size:4.5rem;padding:.5rem .625rem;background:var(--switch);color:var(--switch-ink);border:1.5px solid var(--line);border-radius:3px}
@media (prefers-reduced-motion:no-preference){
.rocker .paddle,.rocker .led{transition:transform .12s ease-out,background-color .12s ease-out,border-color .12s ease-out}
.rocker[aria-checked="true"] .paddle{transform:translateY(-2px)}
}
dialog{overscroll-behavior:contain;max-inline-size:min(30rem,92vw);border:2px solid var(--line);border-radius:0;background:var(--bay);color:var(--ink);padding:1.25rem}
dialog::backdrop{overflow:hidden;overscroll-behavior:contain;background:rgb(0 0 0 / .55)}
dialog h2{margin:0 0 .5rem;font-size:1.125rem;line-height:1.3}
dialog p{margin:.25rem 0}
dialog .actions{display:flex;gap:.75rem;justify-content:flex-end;margin-block-start:1.25rem;flex-wrap:wrap}
dialog .danger-note{color:var(--err);font-weight:600}
.qr-box{background:#ffffff;border:2px solid #111418;padding:1rem;min-block-size:140px;display:flex;align-items:center;justify-content:center;overflow:auto;color:#111418}
.qr-box svg{max-inline-size:100%;block-size:auto}
.visually-hidden{position:absolute !important;clip-path:inset(50%) !important;overflow:hidden !important;width:1px !important;height:1px !important;margin:-1px !important;padding:0 !important;border:0 !important;white-space:nowrap !important}
@media (max-width:22.5rem){.wrap{padding-inline:.75rem}body{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>home</h1>
<div class="bar">
<button type="button" id="refresh" class="primary">Refresh</button>
<button type="button" id="signout">Sign out</button>
</div>
</header>
<main>
<div class="banner" id="backend-banner" aria-live="polite" hidden></div>
<p id="status-msg" class="status" role="status" aria-live="polite"></p>
<section aria-labelledby="list-heading">
<h2 id="list-heading" class="visually-hidden">Device breakers</h2>
<div id="list-slot"></div>
</section>
</main>
</div>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
<h2 id="confirm-title">Confirm sensitive action</h2>
<p id="confirm-text"></p>
<div class="actions">
<button type="button" id="confirm-cancel" autofocus>Cancel</button>
<button type="button" id="confirm-ok" class="primary">Confirm</button>
</div>
</dialog>
<dialog id="pw-dialog" aria-labelledby="pw-title">
<h2 id="pw-title">Panel password</h2>
<p id="pw-text" class="note"></p>
<form id="pw-form" method="dialog">
<label for="pw-input">Password</label>
<input id="pw-input" name="password" type="password" autocomplete="current-password" required>
<p id="pw-err" class="err-text" role="alert" hidden></p>
<div class="actions">
<button type="button" id="pw-cancel" autofocus>Cancel</button>
<button type="submit" id="pw-ok" class="primary">Continue</button>
</div>
</form>
</dialog>
<dialog id="qr-dialog" aria-labelledby="qr-title">
<h2 id="qr-title">Sign in to Tuya</h2>
<p id="qr-hint" class="note"></p>
<div class="field">
<label for="qr-code">User code (optional)</label>
<input id="qr-code" name="user_code" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
</div>
<div class="actions" style="justify-content:flex-start;margin-top:.75rem">
<button type="button" id="qr-generate" class="primary">Generate QR code</button>
<button type="button" id="qr-close">Close</button>
</div>
<p id="qr-status" role="status" aria-live="polite" style="margin:.75rem 0 0"></p>
<p id="qr-err" class="err-text" role="alert" hidden></p>
<div class="qr-box" id="qr-box" role="img" aria-label="QR code" style="margin-top:.75rem">No QR code yet.</div>
<div class="actions" id="qr-retry-wrap" hidden>
<button type="button" id="qr-retry">Retry</button>
</div>
</dialog>
<script>
"use strict";
var $=function(id){return document.getElementById(id);};
var POLL_MS=10000;
// Control ids are derived from the Device id and the control's position, so a
// rebuild from unchanged state produces identical markup and is skipped.
var uidDev=null;
var uidSeq=0;
function uid(dev,prefix){
  if(uidDev!==dev){uidDev=dev;uidSeq=0;}
  uidSeq+=1;
  return prefix+dev.id+"-"+uidSeq;
}
function isVisible(){return document.visibilityState==="visible"&&!document.hidden;}
function errText(j){if(!j||!j.error)return "Request failed";var e=j.error;if(e.message)return e.message;return e.code||"Request failed";}
function errCode(j){return (j&&j.error&&j.error.code)||"";}
function isReauth(j,status){return status===424||errCode(j)==="reauth_required";}

// --- dialogs -------------------------------------------------------------
var dialog=$("confirm-dialog");
var confirmResolve=null;
function askConfirm(title,text,okLabel){
  return new Promise(function(resolve){
    $("confirm-title").textContent=title;
    $("confirm-text").textContent=text;
    $("confirm-ok").textContent=okLabel;
    confirmResolve=resolve;
    dialog.showModal();
  });
}
function settleConfirm(value){
  var r=confirmResolve;confirmResolve=null;
  if(dialog.open)dialog.close();
  if(r)r(value);
}
dialog.addEventListener("cancel",function(){settleConfirm(false);});
dialog.addEventListener("close",function(){settleConfirm(false);});
$("confirm-cancel").addEventListener("click",function(){settleConfirm(false);});
$("confirm-ok").addEventListener("click",function(){settleConfirm(true);});

// The override password lives only in the input and in the request body that
// reads it. It is cleared on open, submit, cancel and close, and never kept in
// a variable that outlives the POST built from it.
var pwDialog=$("pw-dialog");
var pwResolve=null;
// Resolves with a function that puts the password into one request body and
// immediately empties the input, or null when the operator cancels. The value
// is never held in a variable, storage or a URL.
function askPassword(dev){
  return new Promise(function(resolve){
    $("pw-text").textContent="Enter the panel password to operate "+dev.name+" once. It goes out with this one request and is not stored.";
    $("pw-err").hidden=true;
    $("pw-input").value="";
    pwResolve=resolve;
    if(!pwDialog.open)pwDialog.showModal();
    $("pw-input").focus();
  });
}
function settlePassword(value){
  var r=pwResolve;pwResolve=null;
  if(pwDialog.open)pwDialog.close();
  $("pw-input").value="";
  if(r)r(value);
}
pwDialog.addEventListener("cancel",function(){settlePassword(null);});
pwDialog.addEventListener("close",function(){$("pw-input").value="";});
$("pw-cancel").addEventListener("click",function(){settlePassword(null);});
$("pw-form").addEventListener("submit",function(e){
  e.preventDefault();
  var input=$("pw-input");
  if(!input.value){input.reportValidity();return;}
  settlePassword(input.value);
});

var tuyaUserCodeConfigured=false;
function clearBanner(){var b=$("backend-banner");b.textContent="";b.innerHTML="";b.hidden=true;}
function makeBtn(text,secondary,handler){
  var b=document.createElement("button");b.type="button";b.textContent=text;
  if(!secondary)b.className="primary";
  b.addEventListener("click",handler);
  return b;
}
function tuyaReauthNodes(){
  var t=document.createElement("span");t.className="banner-text";
  t.textContent="Tuya needs you to sign in again. Open your Smart Life app on your phone, then sign in here with the QR code.";
  return [t,makeBtn("Sign in to Tuya (QR)",false,function(){openQr();})];
}
function ghReauthNodes(){
  var nodes=[];
  var t=document.createElement("span");t.className="banner-text";
  t.textContent="Google Home needs you to sign in again in a browser to get a fresh oauth_token. This cannot be finished in this panel. Run this command, then press Refresh:";
  nodes.push(t);
  var c1=document.createElement("code");c1.textContent="home gh login --email <your-email>";nodes.push(c1);
  var note=document.createElement("span");note.className="banner-text";
  note.textContent="If this panel runs in a container, run: ";
  nodes.push(note);
  var c2=document.createElement("code");c2.textContent="docker exec -i <container> home gh login --email <your-email>";nodes.push(c2);
  nodes.push(makeBtn("Refresh",true,function(){load();}));
  return nodes;
}
function renderBannerNodes(nodes){
  var b=$("backend-banner");b.innerHTML="";b.hidden=false;
  nodes.forEach(function(n){b.appendChild(n);});
}
function renderTuyaReauth(){renderBannerNodes(tuyaReauthNodes());}
function renderGhReauth(){renderBannerNodes(ghReauthNodes());}
function renderReauthBanner(backend){
  if(backend==="tuya")renderTuyaReauth();else renderGhReauth();
}
function bannerFor(data,statusData){
  var tuyaStatus=statusData&&statusData.tuya&&statusData.tuya.status;
  var tuyaErr=data&&data.tuya_error;
  var ghErr=data&&data.google_home_error;
  // /api/status is served from a cached flag that a successful device list
  // clears, so after a QR sign-in it can still carry the old failure. When the
  // list itself answered (tuya present) or carried its own error, that answer
  // is the newer proof and status is ignored.
  var tuyaReauth;
  if(tuyaErr&&tuyaErr.error)tuyaReauth=tuyaErr.error.code==="reauth_required";
  else if(data&&data.tuya)tuyaReauth=false;
  else tuyaReauth=tuyaStatus==="reauth_required";
  var ghReauth=ghErr&&ghErr.error&&ghErr.error.code==="reauth_required";
  if(tuyaReauth&&ghReauth){
    var nodes=[];
    var t=document.createElement("span");t.className="banner-text";
    t.textContent="Both backends need you to sign in again. Tuya uses the QR code here. Google Home needs a browser sign-in, run this command and press Refresh:";
    nodes.push(t);
    var c1=document.createElement("code");c1.textContent="home gh login --email <your-email>";nodes.push(c1);
    var note=document.createElement("span");note.className="banner-text";
    note.textContent="If this panel runs in a container, run: ";
    nodes.push(note);
    var c2=document.createElement("code");c2.textContent="docker exec -i <container> home gh login --email <your-email>";nodes.push(c2);
    nodes.push(makeBtn("Sign in to Tuya (QR)",false,function(){openQr();}));
    nodes.push(makeBtn("Refresh",true,function(){load();}));
    renderBannerNodes(nodes);
    return;
  }
  if(tuyaReauth){renderTuyaReauth();return;}
  if(ghReauth){renderGhReauth();return;}
  var parts=[];
  ["google_home","tuya"].forEach(function(bk){
    var e=data&&data[bk+"_error"];
    if(e&&e.error){
      var name=bk==="google_home"?"Google Home":"Tuya";
      parts.push(name+": "+(e.error.code||"error")+".");
    }
  });
  if(tuyaStatus&&tuyaStatus!=="ok")parts.push("Tuya: "+tuyaStatus+".");
  var banner=$("backend-banner");
  if(parts.length){banner.innerHTML="";var t=document.createElement("span");t.className="banner-text";t.textContent=parts.join(" ");banner.appendChild(t);banner.hidden=false;}
  else{clearBanner();}
}

var qrDialog=$("qr-dialog");
var qrPolling=false;
var qrTimer=null;
function qrMsg(m){$("qr-status").textContent=m;}
function qrShowErr(m){
  var e=$("qr-err");e.textContent=m;e.hidden=false;
  $("qr-retry-wrap").hidden=false;
}
function qrClearErr(){var e=$("qr-err");e.textContent="";e.hidden=true;$("qr-retry-wrap").hidden=true;}
function openQr(){
  qrClearErr();
  $("qr-box").textContent="No QR code yet.";
  $("qr-hint").textContent=tuyaUserCodeConfigured?
    "The server already has a user code configured, so you can leave this field empty. If you need it, find it in Smart Life app, then Me, Settings, Account and Security, User Code.":
    "Optional. Leave empty if the server already has a user code. To find yours, open Smart Life app, then Me, Settings, Account and Security, User Code.";
  qrMsg("Enter your code if needed, then press Generate QR code.");
  if(!qrDialog.open)qrDialog.showModal();
  $("qr-code").focus();
}
function stopQrPoll(){qrPolling=false;if(qrTimer){clearTimeout(qrTimer);qrTimer=null;}}
qrDialog.addEventListener("close",function(){stopQrPoll();});
$("qr-close").addEventListener("click",function(){qrDialog.close();});
$("qr-generate").addEventListener("click",function(){startQrLogin();});
$("qr-retry").addEventListener("click",function(){startQrLogin();});
function startQrLogin(){
  stopQrPoll();qrClearErr();
  var code=$("qr-code").value.trim();
  qrMsg("Loading. Generating QR code...");
  var body=new URLSearchParams();
  if(code)body.set("user_code",code);
  fetch("/api/tuya/login/start",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
  .then(function(r){return r.json().then(function(j){return [r,j];});})
  .then(function(pair){
    var status=pair[0].status;var j=pair[1];
    if(isReauth(j,status)){qrShowErr("Tuya sign-in failed: "+errText(j));qrMsg("Try Again.");return;}
    if(j.error){qrShowErr("Could not start Tuya sign-in: "+errText(j));qrMsg("Try Again.");return;}
    var d=j.data||{};
    var svg=d.qr_svg;
    if(typeof svg!=="string"||!svg){qrShowErr("The server answered without a QR code. Try Again.");qrMsg("Try Again.");return;}
    $("qr-box").innerHTML=svg;
    qrMsg("Scan the QR code with the Smart Life app. Waiting for the scan...");
    pollQr(d.token,code);
  })
  .catch(function(e){qrShowErr("Network error: "+e.message);qrMsg("Try Again.");});
}
function pollQr(token,code){
  qrPolling=true;
  function tick(){
    if(!qrPolling||!qrDialog.open)return;
    if(!isVisible()){qrTimer=setTimeout(tick,2000);return;}
    var body=new URLSearchParams({token:token||""});
    if(code)body.set("user_code",code);
    fetch("/api/tuya/login/poll",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
    .then(function(r){return r.json().then(function(j){return [r,j];});})
    .then(function(pair){
      if(!qrPolling||!qrDialog.open)return;
      var status=pair[0].status;var j=pair[1];
      if(j.error){stopQrPoll();qrShowErr("Polling failed: "+errText(j));qrMsg("Try Again.");return;}
      var d=j.data||{};
      if(d.status==="authenticated"){
        stopQrPoll();
        qrMsg("Tuya sign-in restored. Refreshing devices...");
        load();
        return;
      }
      qrMsg("Waiting for the scan... (pending)");
      qrTimer=setTimeout(tick,2000);
    })
    .catch(function(e){
      if(!qrPolling||!qrDialog.open)return;
      qrMsg("Waiting for the scan... (network retry)");
      qrTimer=setTimeout(tick,2000);
    });
  }
  tick();
}

// --- rows and groups -----------------------------------------------------
function rowsFor(devices,data){
  var protectedList=(data&&data.protected)||[];
  var list=[];
  (devices.google_home||[]).forEach(function(d){
    var key=(d.backend||"google_home")+":"+d.id;
    var isP=protectedList.some(function(p){return (p.backend+":"+p.device_id)===key;});
    list.push({backend:"google_home",label:"Google Home",group:(d.room&&String(d.room).trim())||"Other",id:d.id,name:d.name,room:d.room,traits:d.traits||[],isProtected:isP,category:d.kind,_seq:0});
  });
  (devices.tuya||[]).forEach(function(d){
    var key=(d.backend||"tuya")+":"+d.id;
    var isP=protectedList.some(function(p){return (p.backend+":"+p.device_id)===key;});
    list.push({backend:"tuya",label:"Tuya",group:"Smart Life",id:d.id,name:d.name,room:null,traits:[],isProtected:isP,online:d.online,category:d.category,_seq:0});
  });
  return list;

function rowsKey(rows){
  return rows.map(function(d){return d.backend+":"+d.id+"|"+d.name+"|"+d.group+"|"+d.isProtected;}).join(",");

function groupRows(rows){
  var order=[];var map={};
  rows.forEach(function(dev){
    if(!map[dev.group]){map[dev.group]={name:dev.group,backend:dev.label,rows:[]};order.push(dev.group);}

function renderRows(rows){

  // made sliders unusable. When the device set is unchanged, keep the live
  // DOM and refresh the state in place instead.
  var key=rowsKey(rows);
  if(key&&key===slot._key){
    var old=slot._rows;
    rows.forEach(function(now,i){
      now._stateEl=old[i]._stateEl;now._errEl=old[i]._errEl;
      now._controlsEl=old[i]._controlsEl;now._teleEl=old[i]._teleEl;
      now._switchEl=old[i]._switchEl;now._foldEl=old[i]._foldEl;now._foldBody=old[i]._foldBody;

    b.textContent=group.backend;

    var ul=document.createElement("ul");

    group.rows.forEach(function(dev){
      var li=document.createElement("li");
      li.className="device";
      var idBox=document.createElement("div");
      idBox.className="dev-id";
      var name=document.createElement("div");
      name.className="name";

      idBox.appendChild(name);

      var read=document.createElement("div");
      read.className="dev-read";
      li.appendChild(read);

// --- device state --------------------------------------------------------
function ghTraits(dev){return dev._state&&dev._state.traits?dev._state.traits:{};}
function tuyaPts(dev){return dev._state&&dev._state.data_points?dev._state.data_points:[];}
function isCalib(code){return code.toLowerCase().indexOf("calib")!==-1;}
function stateSummary(dev,data){
  if(dev._online===false)return "State: offline";
  if(!data)return "State: unknown";
  if(dev.backend==="google_home"){
    var t=data.traits||{};
    if(t.onOff&&typeof t.onOff.onOff==="boolean")return "State: "+(t.onOff.onOff?"on":"off");
    if(t.lockUnlock&&typeof t.lockUnlock.isLocked==="boolean")return "State: "+(t.lockUnlock.isLocked?"locked":"unlocked");
    if(t.armDisarm&&typeof t.armDisarm.isArmed==="boolean")return "State: "+(t.armDisarm.isArmed?"armed":"disarmed");
    if(t.brightness&&typeof t.brightness.brightness==="number")return "State: brightness "+t.brightness.brightness+"%";
    if(t.volume&&typeof t.volume.currentVolume==="number")return "State: volume "+t.volume.currentVolume+"%";
    return "State: online";
  }
  var pts=data.data_points||[];
  var sw=null;
  for(var i=0;i<pts.length;i++){if(pts[i].code==="switch_1"){sw=pts[i];break;}}

  return "State: online";
}
function snapshot(dev){
  try{return JSON.parse(JSON.stringify(dev._state||null));}catch(e){return dev._state||null;}
}
function rollback(dev,snap,msg){
  dev._state=snap;
  var t=ghTraits(dev);
  if(dev.backend==="google_home"&&t.deviceStatus&&typeof t.deviceStatus.online==="boolean")dev._online=t.deviceStatus.online;
  if(dev.backend!=="google_home"&&snap&&typeof snap.online==="boolean")dev._online=snap.online;
  buildControl(dev,snap);
  dev._stateEl.textContent=stateSummary(dev,snap);
  dev._errEl.textContent="Error: "+msg;
  dev._errEl.hidden=false;
}
function setSyncing(dev){
  dev._errEl.textContent="";dev._errEl.hidden=true;
  var s=stateSummary(dev,dev._state);
  dev._stateEl.innerHTML="";
  dev._stateEl.appendChild(document.createTextNode(s+" "));
  var n=document.createElement("span");n.className="sync-note";n.textContent="Syncing...";
  dev._stateEl.appendChild(n);
}
function postForm(path,body){
  return fetch(path,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
  .then(function(r){return r.json().then(function(j){return [r.status,j];}).catch(function(){return [r.status,{error:{message:"Bad response"}}];});});
}

// One write path for every control, so the guards cannot be skipped by a
// control added later. A Sensitive Action asks first; a protected Device asks
// for the one-time password next; a cancel at either step rebuilds the
// controls from the snapshot and sends nothing.
function guardedWrite(dev,opts){
  var snap=snapshot(dev);
  function step(){
    if(!dev.isProtected)return run(null);
    return askPassword(dev).then(function(password){
      if(!password){buildControl(dev,snap);return;}
      return run(password);
    });
  }
  function run(password){
    dev._seq+=1;
    if(opts.mutate&&dev._state)opts.mutate(dev._state);
    setSyncing(dev);
    buildControl(dev,dev._state);
    var body=new URLSearchParams(opts.params);
    // The one-time override is written into this request body and nowhere
    // else; the dialog input was already cleared synchronously.
    if(password)body.set("password",password);
    return postForm(opts.path,body).then(function(pair){
      var status=pair[0];var j=pair[1];
      if(j&&j.error){
        if(isReauth(j,status))renderReauthBanner(dev.backend);
        var code=errCode(j);
        rollback(dev,snap,code==="rate_limited"?"Too many failed password attempts. Wait, then try again.":errText(j));
        return;
      }
      fetchState(dev);
    }).catch(function(e){rollback(dev,snap,e.message);});
  }
  if(opts.sensitive){
    return askConfirm(opts.sensitiveTitle,opts.sensitiveText,opts.sensitiveLabel).then(function(ok){
      if(!ok){buildControl(dev,snap);return;}
      return step();
    });
  }
  return step();
}
function ghSetPost(dev,params){
  var p={device:dev.id};
  Object.keys(params).forEach(function(k){
    if(params[k]===undefined||params[k]===null)return;
    p[k]=String(params[k]);
  });
  return {path:"/api/gh/set",params:p};
}
function tuyaSetPost(dev,onVal){
  return {path:onVal?"/api/tuya/on":"/api/tuya/off",params:{device:dev.id}};
}

function fetchState(dev){
  var my=++dev._seq;
  dev._stateEl.textContent="Loading state...";
  if(dev._teleEl)renderTelemetry(dev,"loading",null);
  var path=dev.backend==="google_home"?("/api/gh/get?device="+encodeURIComponent(dev.id)):("/api/tuya/get?device="+encodeURIComponent(dev.id));
  fetch(path,{headers:{"Accept":"application/json"}}).then(function(r){
    return r.json().then(function(j){return [r,j];}).catch(function(){return [r,{error:{message:"Bad response"}}];});
  }).then(function(pair){
    if(my!==dev._seq)return;
    var r=pair[0];var j=pair[1];
    if(j&&j.error){
      if(isReauth(j,r.status))renderReauthBanner(dev.backend);
      // An offline row says so in words; the backend message can carry the
      // Device ID, which normal UI never shows.
      var msg=errText(j);
      var off=errCode(j)==="device_offline"||msg.toLowerCase().indexOf("offline")!==-1;
      dev._stateEl.textContent="State: "+(off?"offline":msg);
      dev._online=false;
      buildControl(dev,null,j);
      if(dev._teleEl)renderTelemetry(dev,"error",off?"offline":msg);
      return;
    }
    var data=j.data||{};
    dev._state=data;
    if(dev.backend==="google_home"){
      var t=data.traits||{};
      if(t.deviceStatus&&typeof t.deviceStatus.online==="boolean")dev._online=t.deviceStatus.online;
      else if(typeof data.online==="boolean")dev._online=data.online;
    }else{
      if(typeof data.online==="boolean")dev._online=data.online;
    }
    dev._stateEl.textContent=stateSummary(dev,data);
    buildControl(dev,data);
    if(dev._teleEl)renderTelemetry(dev,"data",data.telemetry);
  }).catch(function(e){
    if(my!==dev._seq)return;
    dev._stateEl.textContent="State: "+e.message;
    buildControl(dev,null);
    if(dev._teleEl)renderTelemetry(dev,"error",e.message);
  });
}

// --- telemetry -----------------------------------------------------------
function fmtTeleVal(entry){
  var v=(entry&&typeof entry.value!=="undefined"&&entry.value!==null)?entry.value:(entry?entry.raw:"");
  var s="";
  if(typeof v==="number")s=String(Number(v.toFixed(1)));
  else s=String(v==null?"":v);
  var u=entry&&entry.unit?String(entry.unit):"";
  return (s+(u?" "+u:"")).trim()||"Read-only";
}
function renderTelemetry(dev,mode,payload){
  var el=dev._teleEl;if(!el)return;
  el.textContent="";
  var h=document.createElement("h3");h.textContent="Telemetry";el.appendChild(h);
  if(mode==="loading"){
    var p=document.createElement("p");p.className="note";p.textContent="Loading telemetry...";el.appendChild(p);return;
  }
  if(mode==="error"){
    // An offline plug cannot answer for its readings, and the row already
    // says so next to the switch: one quiet note beats a second red line.
    var off=String(payload).toLowerCase().indexOf("offline")!==-1;
    var e=document.createElement("p");
    e.className=off?"note":"err-text";
    if(!off)e.setAttribute("role","alert");
    e.textContent=off?"Telemetry unavailable while the device is offline.":"Telemetry error: "+payload;
    el.appendChild(e);
    if(!off)el.appendChild(makeBtn("Retry",true,function(){fetchState(dev);}));
    return;
  }
  var tele=payload||{};
  var keys=Object.keys(tele);
  if(!keys.length){
    var q=document.createElement("p");q.className="note";q.textContent="No telemetry readings reported.";el.appendChild(q);return;
  }
  // Power is the one enlarged reading in the whole panel. Everything else
  // stays small so the eye lands on the breaker's live load.
  var power=tele.cur_power;
  if(power){
    var row=document.createElement("p");row.className="power";
    var w=document.createElement("span");w.className="watts";
    w.textContent=String(Number(Number(power.value!==undefined?power.value:power.raw).toFixed(1)));
    var u=document.createElement("span");u.className="unit";u.textContent=power.unit?String(power.unit):"W";
    row.appendChild(w);row.appendChild(u);el.appendChild(row);
  }
  // One line of secondary telemetry. These are the readings the row carries;
  // no raw point behind them is printed a second time.
  var order=["cur_current","cur_voltage","add_ele"];
  var labels={cur_current:"Current",cur_voltage:"Voltage",add_ele:"Energy"};
  var rest=order.filter(function(k){return keys.indexOf(k)!==-1;});
  if(rest.length){
    // Units carry the meaning, so the line stays one line at 390; the labels
    // stay in the accessible text.
    var line=document.createElement("p");
    line.className="secondary";
    rest.forEach(function(k,i){
      if(i)line.appendChild(document.createTextNode(" · "));
      var l=document.createElement("span");l.className="visually-hidden";l.textContent=labels[k]+" ";
      var v=document.createElement("span");v.className="tval";v.textContent=fmtTeleVal(tele[k]);
      line.appendChild(l);line.appendChild(v);
    });
    el.appendChild(line);
  }
}
// The raw read-only points the Telemetry block already shows once.
var TELE_CODES={cur_power:1,cur_current:1,cur_voltage:1,add_ele:1};

function sliderField(dev,labelText,min,max,step,initial,fmt,onSubmit){

// The tactile flip switch. A real button with role="switch", so Enter and

function traitKnownName(trait){
  var t=String(trait);

  if(t.indexOf("Brightness")!==-1)return "brightness";
  if(t.indexOf("ColorSetting")!==-1)return "color";
  if(t.indexOf("LockUnlock")!==-1)return "lock";
  if(t.indexOf("ArmDisarm")!==-1)return "arm";
  if(t.indexOf("Volume")!==-1)return "volume";

function stateValSummary(v){

  if(typeof v!=="object")return String(v);
  var parts=[];
  Object.keys(v).slice(0,4).forEach(function(k){
    var x=v[k];
    parts.push(k+"="+(typeof x==="object"?JSON.stringify(x):String(x)));
  });

function findTraitState(t,declaredTrait){

  var cands=[short.charAt(0).toLowerCase()+short.slice(1),short.toLowerCase(),short];
  for(var i=0;i<cands.length;i++){if(t[cands[i]]!==undefined)return [cands[i],t[cands[i]]];}
  return [short,null];

function buildControl(dev,data,err){
  // Every poll rebuilt the controls, which threw away keyboard focus in the
  // middle of a slider drag. Build off-document and swap only when the markup
  // actually changed; when it did, put focus back on the same control.
  rebuild(dev._switchEl,function(wrap){buildSwitchInto(dev,data,err,wrap);});
  rebuild(dev._controlsEl,function(wrap){buildTraitInto(dev,data,err,wrap);});
}
function rebuild(target,build){
  if(!target)return;
  var focusables=target.querySelectorAll("button,input,select");
  var focused=-1;
  for(var i=0;i<focusables.length;i++){if(focusables[i]===document.activeElement){focused=i;break;}}
  var wrap=document.createElement("div");
  build(wrap);
  if(wrap.innerHTML===target.innerHTML)return;
  target.textContent="";
  while(wrap.firstChild)target.appendChild(wrap.firstChild);
  if(focused!==-1){
    var next=target.querySelectorAll("button,input,select");
    if(next[focused])next[focused].focus();
  }
}
function buildSwitchInto(dev,data,err,wrap){
  // A protected Device puts its control inside the cover, so the word sits on
  // the thing it guards rather than floating above it.
  var into=wrap;
  if(dev.isProtected){
    var cover=document.createElement("div");
    cover.className="cover";
    cover.appendChild(guardCover());
    wrap.appendChild(cover);
    into=cover;
  }
  if(errCode(err)==="device_offline"||(!data&&dev._online===false)||(dev._online===false&&dev.backend==="tuya")){
    into.appendChild(offlineControl(dev));
    return;
  }
  var onVal=false;var hasSwitch=false;
  if(dev.backend==="google_home"){
    var t=ghTraits(dev);
    var traits=dev.traits||[];
    var known={};
    traits.forEach(function(tr){var k=traitKnownName(tr);if(k)known[k]=true;});
    if(known.onOff){hasSwitch=true;onVal=!!(t.onOff&&typeof t.onOff.onOff==="boolean"&&t.onOff.onOff);}
    if(known.lock){
      var isLocked=t.lockUnlock&&typeof t.lockUnlock.isLocked==="boolean"?t.lockUnlock.isLocked:null;
      into.appendChild(actionButton(dev,isLocked===true?"Unlock":"Lock",function(){
        var next=!(isLocked===true);
        guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"lockUnlock.isLocked",value:next,confirm:next?undefined:true}),{
          sensitive:!next,
          sensitiveTitle:"Confirm sensitive action",
          sensitiveText:"Unlock "+dev.name+"? Confirm, then enter the panel password if this Device is protected.",
          sensitiveLabel:"Continue",
          mutate:function(st){if(st.traits&&st.traits.lockUnlock)st.traits.lockUnlock.isLocked=next;}
        }));
      }));

    }
    if(known.arm){
      var isArmed=t.armDisarm&&typeof t.armDisarm.isArmed==="boolean"?t.armDisarm.isArmed:null;
      into.appendChild(actionButton(dev,isArmed===true?"Disarm":"Arm",function(){
        var next=!(isArmed===true);
        guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"armDisarm.isArmed",value:next,confirm:next?undefined:true}),{
          sensitive:!next,
          sensitiveTitle:"Confirm sensitive action",
          sensitiveText:"Disarm "+dev.name+"? Confirm, then enter the panel password if this Device is protected.",
          sensitiveLabel:"Continue",
          mutate:function(st){if(st.traits&&st.traits.armDisarm)st.traits.armDisarm.isArmed=next;}
        }));
      }));
      return;
    }
    if(known.onOff){
      into.appendChild(switchButton(dev,onVal,function(){
        var next=!onVal;
        guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"onOff",value:next}),{
          mutate:function(st){
            if(!st.traits)st.traits={};if(!st.traits.onOff)st.traits.onOff={};
            st.traits.onOff.onOff=next;
          }
        }));
      }));
    }
    // No power switch to flip (brightness, colour, volume, thermostat): the
    // trait sliders next to this column are the controls, so the flip slot
    // stays empty rather than carrying a word with nothing to do.
    return;
  }
  var pts=tuyaPts(dev);
  pts.forEach(function(p){if(p.code==="switch_1"){hasSwitch=true;onVal=!!p.value;}});
  if(hasSwitch||pts.length===0){
    into.appendChild(switchButton(dev,onVal,function(){
      var next=!onVal;
      guardedWrite(dev,Object.assign(tuyaSetPost(dev,next),{
        mutate:function(st){
          var ps=st&&st.data_points?st.data_points:[];
          var found=false;
          ps.forEach(function(p){if(p.code==="switch_1"){p.value=next;found=true;}});
          if(!found)ps.push({code:"switch_1",value:next});
          if(st)st.data_points=ps;
        }
      }));
    }));
    return;
  }
  into.appendChild(readonlyRow("Read-only"));
}
function buildTraitInto(dev,data,err,wrap){
  if(errCode(err)==="device_offline"||(!data&&dev._online===false)){
    wrap.appendChild(readonlyRow("Device is offline. Reconnect it first, then press Refresh."));
    setFold(dev,[]);
    return;
  }
  if(!data){
    wrap.appendChild(readonlyRow("Could not load device state."));
    wrap.appendChild(makeBtn("Retry",true,function(){fetchState(dev);}));
    setFold(dev,[]);
    return;
  }
  if(dev._online===false){
    wrap.appendChild(readonlyRow("Device is offline. Reconnect it first, then press Refresh."));
    setFold(dev,[]);
    return;
  }
  if(dev.backend==="tuya"){
    var pts=tuyaPts(dev);
    var hasSwitch=false;
    var foldRows=[];
    var tele=(dev._state&&dev._state.telemetry)||{};
    pts.forEach(function(p){
      if(p.code==="switch_1")hasSwitch=true;
      // Whatever the telemetry block prints is already on the row; a raw point
      // it covers must not appear a second time, even in the fold.
      if(p.code==="switch_1"||isCalib(p.code)||TELE_CODES[p.code]||tele[p.code])return;
      foldRows.push(p.code+": "+stateValSummary(p.value)+" (Read-only)");
    });
    if(!hasSwitch&&pts.length>0){
      foldRows.unshift("No power switch point on this device. Values below are read-only.");
    }
    setFold(dev,foldRows);
    return;
  }
  var t=ghTraits(dev);
  var traits=dev.traits||[];
  var known={};
  traits.forEach(function(tr){var k=traitKnownName(tr);if(k)known[k]=true;});
  if(known.brightness){
    var b0=t.brightness&&typeof t.brightness.brightness==="number"?t.brightness.brightness:0;
    wrap.appendChild(sliderField(dev,"Brightness",0,100,1,b0,function(v){return v+"%";},function(v){
      guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"brightness",value:v}),{
        mutate:function(st){
          if(!st.traits)st.traits={};if(!st.traits.brightness)st.traits.brightness={};
          st.traits.brightness.brightness=v;
        }
      }));
    }));
  }
  if(known.color){
    var c0=4200;
    var cs=t.color||t.colorSetting;
    if(cs){if(typeof cs.colorTemperature==="number")c0=cs.colorTemperature;else if(typeof cs.temperatureK==="number")c0=cs.temperatureK;}
    wrap.appendChild(sliderField(dev,"Color temperature",1000,10000,100,c0,function(v){return v+" K";},function(v){
      guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"color.colorTemperature",value:v}),{
        mutate:function(st){
          if(!st.traits)st.traits={};
          if(!st.traits.color)st.traits.color={};
          st.traits.color.colorTemperature=v;
        }
      }));
    }));
  }
  if(known.volume){
    var v0=t.volume&&typeof t.volume.currentVolume==="number"?t.volume.currentVolume:0;
    wrap.appendChild(sliderField(dev,"Volume",0,100,1,v0,function(v){return v+"%";},function(v){
      guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"volume.currentVolume",value:v}),{
        mutate:function(st){
          if(!st.traits)st.traits={};if(!st.traits.volume)st.traits.volume={};
          st.traits.volume.currentVolume=v;
        }
      }));
    }));
  }
  if(known.thermostat){
    var th=t.temperatureSetting||t.thermostat||t.temperature||{};
    var mode=th.mode||th.thermostatMode||"auto";
    var setpoint=th.thermostatTemperatureSetpoint;
    if(typeof setpoint!=="number")setpoint=th.thermostatSetpoint;
    if(typeof setpoint!=="number")setpoint=th.setpoint;
    if(typeof setpoint!=="number")setpoint=th.thermostatSetpointHigh;
    if(typeof setpoint!=="number")setpoint=21;
    var modes=["off","heat","cool","heatcool","auto"];
    var row=document.createElement("div");row.className="ctrl-row";
    var f1=document.createElement("div");f1.className="field";
    var idM=uid(dev,"mode-");var lm=document.createElement("label");lm.htmlFor=idM;lm.textContent="Mode";f1.appendChild(lm);
    var sel=document.createElement("select");sel.id=idM;
    modes.forEach(function(m){
      var o=document.createElement("option");o.value=m;o.textContent=m;sel.appendChild(o);
    });
    if(modes.indexOf(mode)===-1){
      var o2=document.createElement("option");o2.value=mode;o2.textContent=mode;
      sel.appendChild(o2);
    }
    sel.value=mode;
    f1.appendChild(sel);row.appendChild(f1);
    var f2=document.createElement("div");f2.className="field";
    var idS=uid(dev,"setpoint-");var ls=document.createElement("label");ls.htmlFor=idS;ls.textContent="Setpoint (degrees)";f2.appendChild(ls);
    var num=document.createElement("input");
    num.type="number";num.id=idS;num.step="0.5";num.min="-20";num.max="60";
    num.value=String(setpoint);num.setAttribute("inputmode","decimal");
    f2.appendChild(num);row.appendChild(f2);
    var apply=document.createElement("button");apply.type="button";apply.textContent="Apply";
    apply.addEventListener("click",function(){
      var m=sel.value;var sp=Number(num.value);
      if(isNaN(sp)){dev._errEl.textContent="Error: Enter a setpoint number.";dev._errEl.hidden=false;return;}
      guardedWrite(dev,Object.assign(ghSetPost(dev,{trait:"thermostat",value:sp,mode:m,setpoint:sp}),{
        mutate:function(st){
          if(!st.traits)st.traits={};
          if(!st.traits.temperatureSetting)st.traits.temperatureSetting={};
          st.traits.temperatureSetting.mode=m;
          st.traits.temperatureSetting.thermostatTemperatureSetpoint=sp;
        }
      }));
    });
    row.appendChild(apply);
    wrap.appendChild(row);
  }
  var renderedKeys=["deviceStatus","onOff","brightness","colorSetting","color","temperatureSetting","thermostat","temperature","volume","lockUnlock","armDisarm"];
  var foldRows=[];
  traits.forEach(function(tr){
    if(!traitKnownName(tr)){
      var found=findTraitState(t||{},tr);
      var short=String(tr).split(".").pop()||String(tr);
      foldRows.push(short+": "+stateValSummary(found[1])+" (Read-only)");
      if(renderedKeys.indexOf(found[0])===-1)renderedKeys.push(found[0]);
    }
  });
  Object.keys(t||{}).forEach(function(k){
    if(renderedKeys.indexOf(k)===-1){
      foldRows.push(k+": "+stateValSummary(t[k])+" (Read-only)");
    }
  });
  if(!Object.keys(known).length&&!traits.length){
    foldRows.push("No known traits on this device. State shown above is read-only.");
  }
  setFold(dev,foldRows);
}

// --- polling -------------------------------------------------------------
var pollTimer=null;
var lastDone=0;
var loading=false;
function schedule(delay){
  if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}
  if(!isVisible())return;
  pollTimer=setTimeout(function(){
    pollTimer=null;
    if(isVisible())load();
  },delay);
}
document.addEventListener("visibilitychange",function(){
  if(!isVisible()){
    if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}
    return;
  }
  var elapsed=Date.now()-lastDone;
  if(elapsed>=POLL_MS)schedule(0);
  else schedule(POLL_MS-elapsed);
});
function load(){
  if(loading)return Promise.resolve();
  loading=true;
  var msg=$("status-msg");
  msg.textContent="Loading devices...";
  var devicesPromise=fetch("/api/devices",{headers:{"Accept":"application/json"}}).then(function(r){return r.json().then(function(j){return [r,j];});});
  var statusPromise=fetch("/api/status",{headers:{"Accept":"application/json"}}).then(function(r){return r.json().then(function(j){return [r,j];});});
  return Promise.all([devicesPromise,statusPromise]).then(function(pair){
    var rJ=pair[0];var sJ=pair[1];
    if(rJ[0].status===401||sJ[0].status===401){location.href="/login";loading=false;return;}
    var j=rJ[1];var sj=sJ[1];
    if(j&&j.error){showError(errText(j));loading=false;lastDone=Date.now();schedule(POLL_MS);return;}
    var data=j.data||{};
    var statusData=sj&&sj.data?sj.data:null;
    if(statusData&&typeof statusData.tuya_user_code_configured!=="undefined")tuyaUserCodeConfigured=!!statusData.tuya_user_code_configured;
    bannerFor(data,statusData);
    // One live status line doubles as the list's label, so no separate
    // "Breakers" heading floats under it.
    var rows=rowsFor(data,data);
    msg.textContent="Updated. "+rows.length+" "+(rows.length===1?"device":"devices")+".";
    renderRows(rows);
    loading=false;lastDone=Date.now();schedule(POLL_MS);
  }).catch(function(e){
    showError(e.message);
    loading=false;lastDone=Date.now();schedule(POLL_MS);
  });
}
$("refresh").addEventListener("click",function(){load();});
$("signout").addEventListener("click",function(){
  fetch("/logout",{method:"POST"}).then(function(){location.href="/login";}).catch(function(){location.href="/login";});
});
load();
</script>
