[workspace]
members = ["crates/home-store", "crates/ghome-backend", "crates/tuya-backend"]
resolver = "2"

[package]
name = "home"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wray-lee/smarthome"
description = "Smart home from the terminal: Google Home and Tuya backends behind one JSON contract."

[[bin]]
name = "home"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
md-5 = "0.11"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.11"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
ghome-backend = { path = "crates/ghome-backend" }
home-store = { path = "crates/home-store" }
tuya-backend = { path = "crates/tuya-backend" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net"] }
wiremock = "0.6"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
