[workspace]
members = ["crates/home-store", "crates/ghome-backend"]
resolver = "2"

[package]
name = "home"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Smart home from the terminal: Google Home and Tuya backends behind one JSON contract."

[[bin]]
name = "home"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
ghome-backend = { path = "crates/ghome-backend" }
home-store = { path = "crates/home-store" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net"] }
wiremock = "0.6"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
