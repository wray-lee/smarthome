[package]
name = "tuya-backend"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Tuya backend: QR login, Cloud Control and Telemetry."

[dependencies]
home-store = { path = "../home-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
md-5 = "0.11"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.11"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
