[package]
name = "ghome-backend"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Google Home backend: gpsoauth credential chain and the foyer JSON gateway."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
home-store = { path = "../home-store" }
